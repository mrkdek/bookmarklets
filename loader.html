<!doctype html><html><head><meta charset="utf-8"><title>Typograph loader</title></head><body><script>
(async()=>{
  const target = window.opener;
  if (!target) { document.body.textContent='Нет исходного окна.'; return; }
  try {
    const r=await fetch('./typograph/script.js?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const code=await r.text();
    target.postMessage({type:'SBOL_TYPOGRAPH_CODE',code},'*');
    document.body.textContent='Код передан. Это окно можно закрыть.';
    setTimeout(()=>window.close(),500);
  } catch(e) { document.body.textContent='Ошибка: '+e.message; }
})();
</script></body></html>
